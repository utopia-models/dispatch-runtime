# Drop-in on bravo's `reconcile-board.service` — #3418, the sweeper.
#
# THIS IS THE WHOLE SCHEDULING CHANGE. No new timer, no new service, no new cron entry. `reconcile-board`
# already wakes every 5 minutes (`OnUnitActiveSec=5min`) and already reads this board; it was missing the
# one thing that makes a scheduled board-reader a scheduler: a consumer for `Status=Todo`.
#
# Why both lines are re-declared, and why both carry `-`:
#   · A `Type=oneshot` unit runs its ExecStart lines in order and STOPS at the first that fails. Appending
#     the sweep to a reconciler that CAN fail would mean the sweep silently never runs on exactly the
#     cycles when something is already wrong — the worst possible correlation. `-` makes each line's
#     failure non-fatal to the other, so a broken reconciler no longer takes the fleet's scheduler with it.
#   · The bare `ExecStart=` clears the unit's inherited list first. Without it systemd APPENDS, and the
#     reconciler would run twice per cycle.
#
# Install (this file is the artifact of record; the box gets a copy):
#   install -Dm644 _infra/systemd/reconcile-board.service.d/10-sweep-dispatch.conf \
#     ~/.config/systemd/user/reconcile-board.service.d/10-sweep-dispatch.conf
#   systemctl --user daemon-reload && systemctl --user cat reconcile-board.service
#
# To halt dispatching without touching any of this: `touch ~/.claude/state/SWEEPER-OFF`, or open an issue
# titled `SWEEPER: OFF` on the board. See sweep-dispatch.sh's header.
[Service]
# Refresh the knowledge clone before running any script. A fix pushed to main does not reach
# the live scheduler until the clone is updated (#5472). This runs a fast-forward-only fetch+merge
# before every cycle, failing open on network errors so the service continues on the old code
# rather than not running at all.
ExecStartPre=-/usr/bin/bash %h/dev/example-org/kb/_infra/scripts/git-ff-refresh.sh %h/dev/example-org/kb
ExecStart=
ExecStart=-/usr/bin/bash %h/.claude/ops/reconcile-board-status.sh --apply
ExecStart=-/usr/bin/bash %h/dev/example-org/kb/_infra/scripts/sweep-dispatch.sh --apply
# dispatch.sh syncs each master's clones over ssh before launching a run (~15-30s each), and a cycle may
# start up to SWEEP_MAX_PER_CYCLE of them. The default 90s start-timeout would kill the sweep mid-dispatch.
# systemd will not start a second cycle while this one is still running, so a long cycle delays the next
# one rather than overlapping it — the no-overlap guarantee comes free from the timer, not from a lockfile.
TimeoutStartSec=900
